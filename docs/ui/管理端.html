<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>林间故事屋 · 管理员</title><link rel="stylesheet" href="style.css"><main class="admin"><header><b class="brand"><i aria-hidden="true"></i>故事屋管理</b><span>管理员工作台</span></header><section id="panel"></section><footer><small>所有操作仅模拟。配置和密码重置不会影响真实服务。刷新后恢复示例。</small></footer></main><script>
const panel=document.querySelector('#panel');let state={model:'wanx2.0-t2i-turbo',budget:50,limit:20};const models=['wanx2.0-t2i-turbo','wan2.2-t2i-flash','doubao-seedream-5-0-flash'];const nav='<p class="row"><button onclick="users()">用户管理</button><button onclick="config()">模型配置</button><button onclick="entry()">退出</button></p>';
function entry(){panel.innerHTML='<h1>管理员登录</h1><p>以演示管理员身份查看用户和模型配置。</p><button class="primary" onclick="users()">进入示例工作台</button>'}
function config(message=''){panel.innerHTML=nav+'<h1>模型配置</h1><form id="settings"><label>出图服务商及模型<select id="model">'+models.map(m=>'<option '+(m===state.model?'selected':'')+' value="'+m+'">'+(m.startsWith('wan')?'阿里云百炼':'火山方舟')+' / '+m+'</option>').join('')+'</select></label><p>密钥状态：已配置（演示）</p><label>全站月预算（元）<input id="budget" type="number" min="0" step=".01" required value="'+state.budget+'"></label><label>每账号每月额度（张，示例）<input id="limit" type="number" min="0" step="1" required value="'+state.limit+'"></label><button class="primary">保存配置</button></form><p role="status">'+message+'</p>';settings.onsubmit=e=>{e.preventDefault();state={model:model.value,budget:Number(budget.value),limit:Number(limit.value)};config('配置已保存，下一笔新任务起生效。')}}
const demoUsers=[
  {name:'示例家长',last:'2026-11-23 09:42'},
  {name:'小禾爸爸',last:'2026-11-22 20:16'},
  {name:'团团妈妈',last:'2026-11-21 18:05'}
];
function users(){
  const rows=demoUsers.map((u,i)=>'<tr><td>'+u.name+'</td><td>'+u.last+'</td><td><button onclick="resetUser('+i+')">重置密码</button></td></tr>').join('');
  panel.innerHTML=nav+'<h1>用户管理</h1><table><thead><tr><th>用户名</th><th>最近登录时间</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table><p id="result" role="status"></p>';
}
function resetUser(i){
  const u=demoUsers[i];
  panel.innerHTML=nav+'<h1>重置密码</h1><div class="box"><h2>'+u.name+'</h2><p>确认后将撤销该账号已有会话，并生成短时有效的一次性临时密码。</p><div class="row"><button autofocus onclick="users()">取消</button><button class="primary" onclick="completeReset('+i+')">确认重置</button></div></div>';
}
function completeReset(i){
  const u=demoUsers[i];
  const bytes=crypto.getRandomValues(new Uint8Array(6));
  const temporary=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
  panel.innerHTML=nav+'<h1>密码已重置</h1><div class="box"><h2>'+u.name+'</h2><p>临时密码</p><strong>'+temporary+'</strong><p>仅供一次登录，首次登录须更改密码。</p></div><button onclick="users()">返回用户列表</button>';
}
entry()
</script></html>
