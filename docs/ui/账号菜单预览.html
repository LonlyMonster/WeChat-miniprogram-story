<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号菜单 · UI 确认</title><link rel="stylesheet" href="style.css"><style>
.account-wrap{position:relative}.account-menu{position:absolute;right:0;top:calc(100% + 6px);width:144px;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:14px;z-index:2;box-shadow:0 6px 20px #203c3018}.account-menu svg{width:17px;height:17px;flex:none;color:var(--green);pointer-events:none}.account-menu button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;text-align:left;background:transparent}.account-menu button:hover{background:#eef1e4}.preview-nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.preview-nav a{color:var(--green)}.password-form{max-width:440px}.password-form button{margin-right:8px}
</style><main><header class="family-header"><div class="family-title"><b class="brand"><i></i><span id="brand"></span></b></div><div class="account-wrap"><button id="account" aria-expanded="true" aria-controls="menu">账号 ▾</button><div id="menu" class="account-menu"><button id="change">修改密码<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg></button><button id="logout">退出账号<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 4H5v16h5m-1-8h12m-5-5 5 5-5 5"/></svg></button></div></div></header><section id="content"></section><footer class="preview-nav"><small>界面预览</small><a href="#family">家长书架</a><a href="#admin">管理首页</a></footer></main><script>
const menu=document.querySelector('#menu'),account=document.querySelector('#account'),content=document.querySelector('#content')
function toggle(open){menu.hidden=!open;account.setAttribute('aria-expanded',String(open))}
function render(){
 const admin=location.hash==='#admin'
 document.querySelector('#brand').textContent=admin?'故事屋管理':'林间故事屋'
 account.hidden=false
 content.innerHTML=admin?'<h1>管理首页</h1><div class="box row"><b>用户管理</b><span>·</span><b>模型配置</b></div>':'<div class="shelfHero"><div class="shelfHero-copy"><p>我的故事屋</p><h1>我的书架</h1><button class="primary" disabled>＋ 讲新故事</button></div><img src="forest.svg" alt="森林里的小兔与狐狸"></div><h2>已保存的故事</h2><p>讲完故事并为它取名，就能收藏第一本漫画。</p>'
 toggle(true)
}
account.onclick=()=>toggle(menu.hidden)
document.onclick=e=>{if(!e.target.closest('.account-wrap'))toggle(false)}
document.onkeydown=e=>{if(e.key==='Escape'){toggle(false);account.focus()}}
document.querySelector('#change').onclick=()=>{
 toggle(false);account.hidden=true
 content.innerHTML='<h1>修改密码</h1><form class="password-form"><label>当前密码<input type="password" required autocomplete="off"></label><label>新密码<input type="password" required autocomplete="off"></label><label>确认新密码<input type="password" required autocomplete="off"></label><p>界面预览，请使用示例密码。</p><button class="primary">确认修改</button><button type="button" id="cancel">取消</button><p role="status"></p></form>'
 const form=content.querySelector('form')
 document.querySelector('#cancel').onclick=()=>{render();toggle(false)}
 form.onsubmit=e=>{e.preventDefault();const fields=form.querySelectorAll('input');const match=fields[1].value===fields[2].value;form.querySelector('[role=status]').textContent=match?'预览完成。正式版将返回登录页。':'两次输入的新密码不一致';if(match)form.reset()}
}
document.querySelector('#logout').onclick=()=>{toggle(false);account.hidden=true;content.innerHTML='<h1>登录我的书架</h1><p>退出流程预览已结束。</p><button id="back">返回预览</button>';document.querySelector('#back').onclick=render}
window.onhashchange=render;render()
</script></html>
